<!DOCTYPE html>
<html lang="en">
  <style>
    .btn-border-reveal {
      background-color: transparent;
      color: rgb(0, 183, 0);
      border: 2px solid rgb(0, 183, 0);
      position: relative;
      padding: 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 13px;
      margin: 5px;
      width: 130px;
      height: 50px;
      cursor: pointer;
    }

    .btn-border-reveal::after {
      content: "";
      position: absolute;
      width: 0;
      height: 100%;
      top: 0;
      left: 0;
      background-color: rgb(0, 183, 0);
      transition: width 0.3s ease;
      z-index: -1;
    }

    .btn-border-reveal:hover::after {
      width: 100%;
    }

    .btn-border-reveal:hover {
      color: white;
    }


    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="btn-border-reveal">Border Reveal</button>
</body>
</html>
